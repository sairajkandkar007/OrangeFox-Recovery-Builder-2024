name: OrangeFox 14.1 - beryl

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox manifest branch
        required: true
        default: "14.1"
        type: choice
        options:
          - "14.1"
          - "12.1"
      DEVICE_TREE:
        description: Device tree repository
        required: true
        default: "https://github.com/sairajkandkar007/android_device_xiaomi_beryl_2"
      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: "main"
      DEVICE_PATH:
        description: Device path
        required: true
        default: "device/xiaomi/beryl"
      DEVICE_NAME:
        description: Device codename
        required: true
        default: "beryl"
      BUILD_TARGET:
        description: Recovery packaging target
        required: true
        default: "vendorboot"
        type: choice
        options:
          - "vendorboot"
          - "recovery"
          - "boot"
      RECOVERY_INSTALLER:
        description: Include recovery installer ZIP
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip \
            bc cpio rsync lz4 zstd libssl-dev

      - name: Sync OrangeFox
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/fox_sync"
          cd "$GITHUB_WORKSPACE/fox_sync"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh \
            --branch "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            --path "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"

      - name: Clone device tree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          mkdir -p "$(dirname "${{ github.event.inputs.DEVICE_PATH }}")"
          rm -rf "${{ github.event.inputs.DEVICE_PATH }}"
          git clone \
            --depth=1 \
            --branch "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.DEVICE_TREE }}" \
            "${{ github.event.inputs.DEVICE_PATH }}"

      - name: Verify device tree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          test -f "${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk"
          test -f "${{ github.event.inputs.DEVICE_PATH }}/device.mk"
          test -f "${{ github.event.inputs.DEVICE_PATH }}/omni_beryl.mk"
          test -f "${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh"
          test -f "${{ github.event.inputs.DEVICE_PATH }}/prebuilt/kernel"
          test -f "${{ github.event.inputs.DEVICE_PATH }}/prebuilt/dtb.img"
          chmod +x "${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh"

      - name: Verify kernel and DTB
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Kernel:"
          sha256sum "${{ github.event.inputs.DEVICE_PATH }}/prebuilt/kernel"
          echo "Expected kernel SHA256:"
          echo "0e9f0474aa8b85815a05fdf7b6b78d6e7a0ed47b34612bb5c59ed5c6b8fe8ab4"
          test "$(sha256sum "${{ github.event.inputs.DEVICE_PATH }}/prebuilt/kernel" | awk '{print $1}')" = \
            "0e9f0474aa8b85815a05fdf7b6b78d6e7a0ed47b34612bb5c59ed5c6b8fe8ab4"
          echo "DTB:"
          sha256sum "${{ github.event.inputs.DEVICE_PATH }}/prebuilt/dtb.img"

      - name: Configure build environment
        id: env
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh 2>&1 | tee "$RUNNER_TEMP/envsetup.log"

          echo "=== AVAILABLE BERYL LUNCH TARGETS ==="
          lunch --list | tee "$RUNNER_TEMP/lunch-list.log" || true

          if lunch --list 2>/dev/null | grep -qx "omni_${{ github.event.inputs.DEVICE_NAME }}-eng"; then
            LUNCH_TARGET="omni_${{ github.event.inputs.DEVICE_NAME }}-eng"
          elif lunch --list 2>/dev/null | grep -qx "twrp_${{ github.event.inputs.DEVICE_NAME }}-eng"; then
            LUNCH_TARGET="twrp_${{ github.event.inputs.DEVICE_NAME }}-eng"
          elif lunch --list 2>/dev/null | grep -qx "fox_${{ github.event.inputs.DEVICE_NAME }}-eng"; then
            LUNCH_TARGET="fox_${{ github.event.inputs.DEVICE_NAME }}-eng"
          else
            echo "No supported beryl eng lunch target found."
            cat "$RUNNER_TEMP/lunch-list.log" || true
            exit 1
          fi

          echo "LUNCH_TARGET=$LUNCH_TARGET" >> "$GITHUB_ENV"
          echo "Selected lunch target: $LUNCH_TARGET"

      - name: Lunch and API audit
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch "$LUNCH_TARGET" 2>&1 | tee "$RUNNER_TEMP/lunch.log"

          echo "=== API / PLATFORM AUDIT ==="
          for v in \
            PLATFORM_VERSION \
            PLATFORM_SDK_VERSION \
            PLATFORM_VERSION_CODENAME \
            PLATFORM_SECURITY_PATCH \
            PRODUCT_SHIPPING_API_LEVEL \
            TARGET_PLATFORM_VERSION \
            TARGET_PLATFORM_VERSION_CODENAME
          do
            printf "%-38s = " "$v"
            get_build_var "$v" 2>/dev/null || true
          done

          echo "=== VENDOR BOOT VARIABLES ==="
          for v in \
            FOX_VENDOR_BOOT_RECOVERY \
            BOARD_BOOT_HEADER_VERSION \
            BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE \
            BOARD_INIT_BOOT_IMAGE_PARTITION_SIZE \
            BOARD_RECOVERYIMAGE_PARTITION_SIZE
          do
            printf "%-38s = " "$v"
            get_build_var "$v" 2>/dev/null || true
          done

      - name: Build OrangeFox
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"

          echo "=== BUILD TARGET DISCOVERY ==="
          if mka help 2>&1 | grep -qE '(^|[[:space:]])vendorbootimage([[:space:]]|$)'; then
            HAVE_VENDORBOOTIMAGE=1
            echo "vendorbootimage target: available"
          else
            HAVE_VENDORBOOTIMAGE=0
            echo "vendorbootimage target: unavailable"
          fi

          case "${{ github.event.inputs.BUILD_TARGET }}" in
            vendorboot)
              if [ "$HAVE_VENDORBOOTIMAGE" = "1" ]; then
                echo "Building vendorbootimage"
                mka adbd vendorbootimage 2>&1 | tee "$RUNNER_TEMP/build.log"
              else
                echo "Building recoveryimage with FOX_VENDOR_BOOT_RECOVERY=1"
                mka adbd recoveryimage 2>&1 | tee "$RUNNER_TEMP/build.log"
              fi
              ;;
            recovery)
              mka adbd recoveryimage 2>&1 | tee "$RUNNER_TEMP/build.log"
              ;;
            boot)
              mka adbd bootimage 2>&1 | tee "$RUNNER_TEMP/build.log"
              ;;
            *)
              echo "Unsupported BUILD_TARGET"
              exit 1
              ;;
          esac

      - name: Collect build outputs
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          mkdir -p "$GITHUB_WORKSPACE/out_artifacts"

          find out/target/product/beryl -maxdepth 1 -type f \
            \( -name "vendor_boot.img" -o -name "recovery.img" -o -name "boot.img" -o -name "*OrangeFox*.zip" -o -name "*recovery*.zip" \) \
            -print -exec cp -f {} "$GITHUB_WORKSPACE/out_artifacts/" \; || true

          ls -lah "$GITHUB_WORKSPACE/out_artifacts"

          if [ -z "$(find "$GITHUB_WORKSPACE/out_artifacts" -type f -print -quit)" ]; then
            echo "No recovery output was produced."
            exit 1
          fi

      - name: Build recovery installer ZIP
        if: ${{ github.event.inputs.RECOVERY_INSTALLER == 'true' }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/installer"

          curl -L --fail --retry 3 \
            -o "$GITHUB_WORKSPACE/installer/recovery-installer.zip" \
            "https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip"

          mkdir -p "$GITHUB_WORKSPACE/installer/unpacked"
          unzip -q "$GITHUB_WORKSPACE/installer/recovery-installer.zip" \
            -d "$GITHUB_WORKSPACE/installer/unpacked"

          IMAGE=""
          for f in \
            "$GITHUB_WORKSPACE/out_artifacts/vendor_boot.img" \
            "$GITHUB_WORKSPACE/out_artifacts/recovery.img"; do
            if [ -f "$f" ]; then
              IMAGE="$f"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "No vendor_boot/recovery image available for installer."
            exit 1
          fi

          cp -f "$IMAGE" "$GITHUB_WORKSPACE/installer/unpacked/recovery.img"

          cd "$GITHUB_WORKSPACE/installer/unpacked"
          zip -qr "$GITHUB_WORKSPACE/out_artifacts/OrangeFox-beryl-vendor_boot-installer.zip" .

      - name: Checksums
        run: |
          cd "$GITHUB_WORKSPACE/out_artifacts"
          sha256sum * | tee SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-beryl-${{ github.event.inputs.MANIFEST_BRANCH }}
          path: out_artifacts/
          if-no-files-found: error

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "===== ENVSETUP ====="
          cat "$RUNNER_TEMP/envsetup.log" 2>/dev/null || true
          echo "===== LUNCH LIST ====="
          cat "$RUNNER_TEMP/lunch-list.log" 2>/dev/null || true
          echo "===== LUNCH ====="
          cat "$RUNNER_TEMP/lunch.log" 2>/dev/null || true
          echo "===== BUILD ====="
          cat "$RUNNER_TEMP/build.log" 2>/dev/null || true
